<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="content-language" content="pt-BR" />
  <title>Otis · Broadcast Info Display — Output</title>
  <link rel="icon" type="image/svg+xml" href="/shared/otis-icon.svg?v=3" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/output/output.css" />
</head>
<body class="theme-output">
<div class="shell">
  <header>
    <div class="header-left">
      <svg class="logo-mark" viewBox="0 0 150 150" aria-label="Otis">
        <circle cx="75" cy="75" r="58" fill="none" stroke="#e9edf2" stroke-width="17"/>
        <rect x="122" y="66" width="17" height="18" fill="#ff3b30"/>
      </svg>
      <div class="header-brand">
        <h1>Broadcast Info Display</h1>
        <span class="subtitle">Saída <span class="mode-pill">PGM · ON AIR</span></span>
      </div>
    </div>
    <!-- Barra de status única: conexão, horário e telemetria (render.js) -->
    <div class="header-status">
      <div class="hcell"><span class="hcell-label">Horário</span><span class="hcell-value" id="clock"></span></div>
      <div class="critical-strip" id="critical-strip" style="display:none"></div>
    </div>
    <div class="header-right"><span class="conn-badge pgm">OUTPUT</span></div>
  </header>
  <div class="memo-banner hidden" id="memo-banner"></div>
  <section class="table-section">
    <div class="table-card">
      <table><thead><tr id="thead-row"><th class="col-frame">Frame</th><th class="col-model">Modelo</th><th class="col-source">Fonte</th><th class="col-desc">Descrição</th><th class="col-note">Nota</th><th class="col-status">Status</th></tr></thead><tbody id="tbody"></tbody></table>
    </div>
  </section>
  <div class="legend" id="legend"></div>
  <footer>
    <span class="footer-note">Broadcast Info Display · v0.3.1</span>
    <!-- Logo completo Otis: anel + wordmark + subtítulo (manual da marca) -->
    <span class="footer-brand" aria-label="Otis Broadcast Engineer">
      <svg class="footer-brand-ring" viewBox="0 0 150 150" aria-hidden="true">
        <circle cx="75" cy="75" r="58" fill="none" stroke="#e9edf2" stroke-width="17"/>
        <rect x="122" y="66" width="17" height="18" fill="#ff3b30"/>
      </svg>
      <span class="footer-brand-text">
        <span class="footer-brand-name">OTIS</span>
        <span class="footer-brand-sub">Broadcast Engineer</span>
      </span>
    </span>
  </footer>
  <div class="big-clock" id="big-clock"><div class="big-clock-time" id="big-clock-time">00:00:00</div><div class="big-clock-date" id="big-clock-date"></div></div>
  <img id="overlay-img" class="hidden" alt="" />
</div>
<script type="module" src="/output/output.js"></script>
</body>
</html>
